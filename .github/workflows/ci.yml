name: CI - Build and Push Images

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            path: frontend
          - name: api-gateway
            path: api-gateway
          - name: menu-service
            path: menu-service
          - name: order-service
            path: order-service
          - name: user-service
            path: user-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          tags: pixelopscloud/${{ matrix.service.name }}:${{ github.sha }}

  update-infra:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: pixelopscloud/restaurant-infra
          token: ${{ secrets.GH_PAT }}

      - name: Update image tags
        run: |
          for service in frontend api-gateway menu-service order-service user-service; do
            sed -i "s|pixelopscloud/${service}:.*|pixelopscloud/${service}:${{ github.sha }}|g" k8s/${service}/deployment.yaml
          done

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Update image tags to ${{ github.sha }}"
          git push
